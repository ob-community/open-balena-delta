name: CI

on:
  push:
    branches-ignore: ['renovate/3rd-party**', 'dependabot/**']
  pull_request:
    branches-ignore: ['renovate/3rd-party**', 'dependabot/**']

env:
  # Repo open-balena-X publishes obcommunity/open-balena-X
  IMAGE_NAME: obcommunity/${{ github.event.repository.name }}
  BASE_VERSION: '1.0.0' # used only if the repo has no version git tags yet

permissions:
  contents: read

jobs:
  # Build on every branch and PR, without pushing
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64 # Dockerfiles download x86_64-only binaries
          push: false

  # Push for everything except PRs, and never from forks; main gets "latest" plus semver tags
  push-to-docker-hub:
    runs-on: ubuntu-latest
    needs: build-docker
    if: ${{ github.repository_owner == 'ob-community' && github.event_name != 'pull_request' }}
    permissions:
      contents: write # action-vtl creates the version tag
    steps:
      - uses: actions/checkout@v6
      - name: Establish Versioning, Tags, and Labels
        id: vtl
        uses: mapped/action-vtl@b5de908f4945891ebda221ce54bc6c8377ccce46
        with:
          baseVersion: ${{ env.BASE_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          dockerImage: ${{ env.IMAGE_NAME }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          push: ${{ steps.vtl.outputs.docker_push }}
          tags: ${{ steps.vtl.outputs.docker_tags }}
          labels: ${{ steps.vtl.outputs.oci_labels }}
